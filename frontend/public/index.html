    <!--
      ========================================================================
      OPENING SEQUENCE

      Inline on purpose. A loading screen built as a React component cannot
      appear until the JS bundle has downloaded, parsed and mounted — which is
      exactly the window it exists to cover. Inlined, it paints on the first
      frame, before a byte of the bundle arrives.

      Pure CSS, so it runs at full framerate on a cheap phone that is still
      parsing JavaScript.

      The sequence, in order:
        0.10s  the mark draws itself, stroke by stroke, in the order a hand
               would draw it: rim, bowl, handle, stem, leaf, saucer
        1.00s  the leaf fills with sage
        1.15s  coffee rises inside the cup — the one moment of colour
        1.30s  the wordmark rises out of a mask, letter by letter
        2.00s  the location line settles in
        exit   the composition lifts and the paper wipes away upward

      Every transform here is on `transform` or `opacity` only, so the whole
      thing is composited on the GPU and never triggers layout.
      ========================================================================
    -->
    <style>
      #tw-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #fbfaf8;
        /* The warm pendant light of the shop, thrown from above. */
        background-image: radial-gradient(
          115% 62% at 50% -8%,
          rgba(193, 135, 63, 0.18),
          rgba(193, 135, 63, 0) 62%
        );
      }

      /* Paper grain, matched to the site so the handoff is seamless. */
      #tw-loader::after {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.04;
        pointer-events: none;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.10  0 0 0 0 0.09  0 0 0 0 0.08  0 0 0 1 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      }

      /*
       * Breathing light. A very slow scale-and-fade on the warm glow, so the
       * screen is never completely static even before the mark starts drawing.
       * Scale and opacity only — composited, costs nothing.
       */
      .tw-glow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(760px, 130vw);
        height: min(760px, 130vw);
        margin-left: calc(min(760px, 130vw) / -2);
        margin-top: calc(min(760px, 130vw) / -2);
        pointer-events: none;
        background: radial-gradient(
          circle,
          rgba(193, 135, 63, 0.13),
          rgba(193, 135, 63, 0.05) 42%,
          rgba(193, 135, 63, 0) 68%
        );
        animation: tw-breathe 7s ease-in-out infinite;
      }
      @keyframes tw-breathe {
        0%,
        100% { transform: scale(0.94); opacity: 0.75; }
        50% { transform: scale(1.06); opacity: 1; }
      }

      .tw-in {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 24px;
      }

      /*
       * Ripple. One pulse timed to the moment the cup finishes filling, like a
       * ring spreading from the surface of the coffee. It punctuates the
       * sequence so the fill has a payoff instead of just stopping.
       */
      .tw-ripple {
        position: absolute;
        top: clamp(48px, 13vw, 69px);
        left: 50%;
        width: clamp(96px, 26vw, 138px);
        height: clamp(96px, 26vw, 138px);
        margin-left: calc(clamp(96px, 26vw, 138px) / -2);
        margin-top: calc(clamp(96px, 26vw, 138px) / -2);
        border: 1px solid rgba(193, 135, 63, 0.5);
        border-radius: 50%;
        opacity: 0;
        pointer-events: none;
        animation: tw-ripple 1.9s cubic-bezier(0.16, 0.84, 0.24, 1) 2.25s forwards;
      }
      .tw-ripple.r2 {
        animation-delay: 2.45s;
        border-color: rgba(193, 135, 63, 0.3);
      }
      @keyframes tw-ripple {
        0% { transform: scale(0.72); opacity: 0; }
        18% { opacity: 0.9; }
        100% { transform: scale(2.1); opacity: 0; }
      }

      /* ---------- The mark ---------- */
      .tw-mark {
        width: clamp(96px, 26vw, 138px);
        height: clamp(96px, 26vw, 138px);
        overflow: visible;
      }

      .tw-mark .s {
        fill: none;
        stroke: #191714;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        /*
         * pathLength="1" normalises every path's length to 1 regardless of its
         * real geometry, so a single dasharray value draws all six strokes.
         */
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: tw-draw 0.92s cubic-bezier(0.65, 0, 0.35, 1) forwards;
      }
      .tw-mark .p1 { animation-delay: 0.1s; }
      .tw-mark .p2 { animation-delay: 0.22s; }
      .tw-mark .p3 { animation-delay: 0.46s; }
      .tw-mark .p4 { animation-delay: 0.56s; }
      .tw-mark .p5 { animation-delay: 0.72s; }
      .tw-mark .p6 { animation-delay: 0.9s; }

      @keyframes tw-draw {
        to { stroke-dashoffset: 0; }
      }

      /* The leaf earns its colour once its outline exists. */
      .tw-leaf-fill {
        fill: #47694e;
        opacity: 0;
        animation: tw-leaf 0.7s cubic-bezier(0.22, 0.75, 0.18, 1) 1s forwards;
      }
      @keyframes tw-leaf {
        to { opacity: 0.9; }
      }

      /*
       * Coffee rising. A rect clipped to the bowl shape and translated upward,
       * so the liquid genuinely fills the cup's silhouette rather than a
       * rectangle being scaled and squashed.
       */
      .tw-coffee {
        transform: translateY(34px);
        animation: tw-fill-cup 1.35s cubic-bezier(0.32, 0.72, 0.24, 1) 1.15s forwards;
      }
      @keyframes tw-fill-cup {
        to { transform: translateY(5px); }
      }

      /* ---------- Wordmark ---------- */
      .tw-word {
        display: flex;
        margin-top: clamp(22px, 5vw, 30px);
        font-family: "Jost", "Plus Jakarta Sans", system-ui, sans-serif;
        font-size: clamp(12px, 3.3vw, 15px);
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.3em;
        color: #191714;
        /* Compensates for the trailing letter-space so the word reads centred. */
        text-indent: 0.3em;
      }
      /* Each letter rises out of its own mask — cleaner than a fade. */
      .tw-l {
        display: inline-block;
        overflow: hidden;
        line-height: 1.35;
      }
      .tw-l i {
        display: inline-block;
        font-style: normal;
        transform: translateY(110%);
        animation: tw-rise 0.62s cubic-bezier(0.22, 0.75, 0.18, 1) forwards;
      }
      @keyframes tw-rise {
        to { transform: translateY(0); }
      }

      .tw-sub {
        margin-top: 10px;
        font-family: "Jost", "Plus Jakarta Sans", system-ui, sans-serif;
        font-size: clamp(8.5px, 2.2vw, 9.5px);
        text-transform: uppercase;
        letter-spacing: 0.36em;
        text-indent: 0.36em;
        color: #5f5a54;
        opacity: 0;
        animation: tw-sub 0.8s cubic-bezier(0.22, 0.75, 0.18, 1) 2s forwards;
      }
      @keyframes tw-sub {
        to { opacity: 1; }
      }

      /* ---------- Progress hairline ---------- */
      .tw-rule {
        position: relative;
        margin-top: clamp(24px, 5vw, 32px);
        width: clamp(120px, 42vw, 168px);
        height: 1px;
        background: rgba(25, 23, 20, 0.1);
        overflow: hidden;
      }
      .tw-rule i {
        position: absolute;
        inset: 0;
        display: block;
        background: linear-gradient(90deg, #c1873f, #d9a44e);
        transform-origin: left;
        transform: scaleX(0);
        /*
         * Eases toward full and slows as it approaches, then the exit takes
         * over. Deliberately not a percentage counter — a fake number that
         * jumps to 100 is worse than an honest suggestion of progress.
         */
        animation: tw-fill 2.6s cubic-bezier(0.12, 0.85, 0.16, 1) 0.9s forwards;
      }
      @keyframes tw-fill {
        to { transform: scaleX(1); }
      }

      /* ---------- Exit ---------- */
      #tw-loader.is-leaving {
        animation: tw-wipe 0.82s cubic-bezier(0.76, 0, 0.24, 1) forwards;
      }
      #tw-loader.is-leaving .tw-in {
        animation: tw-settle 0.46s cubic-bezier(0.4, 0, 1, 1) forwards;
      }
      @keyframes tw-settle {
        to { opacity: 0; transform: translateY(-14px) scale(0.965); }
      }
      @keyframes tw-wipe {
        to { clip-path: inset(0 0 100% 0); }
      }

      /* Repeat visits within a session skip straight to the site. */
      #tw-loader.is-instant { display: none; }

      @media (prefers-reduced-motion: reduce) {
        .tw-glow,
        .tw-ripple {
          animation: none;
        }
        .tw-ripple {
          opacity: 0;
        }
        .tw-mark .s,
        .tw-leaf-fill,
        .tw-coffee,
        .tw-l i,
        .tw-sub,
        .tw-rule i {
          animation: none;
          stroke-dashoffset: 0;
          opacity: 1;
          transform: none;
        }
        .tw-leaf-fill { opacity: 0.9; }
        .tw-coffee { transform: translateY(5px); }
        .tw-rule i { transform: scaleX(1); }
        #tw-loader.is-leaving { animation: tw-fade 0.2s linear forwards; }
        #tw-loader.is-leaving .tw-in { animation: none; }
        @keyframes tw-fade {
          to { opacity: 0; visibility: hidden; }
        }
      }
    </style>
  </head>
  <body>
    <noscript>

    <div id="tw-loader" role="status" aria-live="polite">

      <div class="tw-in">
        <span class="tw-ripple" aria-hidden="true"></span>
        <span class="tw-ripple r2" aria-hidden="true"></span>

        <!-- Geometry identical to src/components/brand/Logo.jsx -->
        <svg class="tw-mark" viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <clipPath id="twBowl">
              <path d="M22 46a28 28 0 0 0 56 0Z" />
            </clipPath>
            <linearGradient id="twBrew" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#C1873F" stop-opacity="0.38" />
              <stop offset="1" stop-color="#4A2E1C" stop-opacity="0.55" />
            </linearGradient>
          </defs>

          <!-- Coffee, clipped to the inside of the bowl -->
          <g clip-path="url(#twBowl)">
            <rect class="tw-coffee" x="20" y="44" width="60" height="34" fill="url(#twBrew)" />
          </g>

          <!-- Leaf fill, under the strokes so the outline stays crisp -->
          <path class="tw-leaf-fill" d="M50 41c5-13 14-21 23-24-2 10-10 20-23 24Z" />

          <path class="s p1" pathLength="1" d="M16 46H84" />
          <path class="s p2" pathLength="1" d="M22 46a28 28 0 0 0 56 0" />
          <path class="s p3" pathLength="1" d="M19.5 55a6.5 6.5 0 1 0-13 0 6.5 6.5 0 1 0 13 0" />
          <path class="s p4" pathLength="1" d="M50 12v62" />
          <path class="s p5" pathLength="1" d="M50 41c5-13 14-21 23-24-2 10-10 20-23 24Z" />
          <path class="s p6" pathLength="1" d="M22 88H78" />
        </svg>

        <div class="tw-word" aria-hidden="true" id="tw-word"></div>
        <div class="tw-sub" aria-hidden="true">Specialty Coffee · Nashik</div>
        <div class="tw-rule"><i></i></div>
      </div>
    </div>

    <div id="root"></div>

    <script>
      (function () {
        var loader = document.getElementById("tw-loader");
        if (!loader) return;

        // Plays on every load, by request. Note this only fires on a real page
        // load — moving between / and /menu is handled by the router in the
        // browser, so navigating the site never replays it.

        // Build the wordmark as masked letters. Done here rather than in markup
        // so the HTML stays readable and the stagger lives in one place.
        var word = document.getElementById("tw-word");
        if (word) {
          var text = "THE WHITE MUG";
          for (var i = 0; i < text.length; i++) {
            var outer = document.createElement("span");
            outer.className = "tw-l";
            var inner = document.createElement("i");
            inner.textContent = text[i] === " " ? "\u00A0" : text[i];
            inner.style.animationDelay = 1.3 + i * 0.042 + "s";
            outer.appendChild(inner);
            word.appendChild(outer);
          }
        }

        // Safety net: if the bundle fails to load or throws, the loader must not
        // strand the visitor behind a blank screen.
        window.setTimeout(function () {
          if (document.body.contains(loader)) loader.classList.add("is-leaving");
        }, 7000);
      })();
    </script>
